name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and apply settings
        working-directory: admin_app
        run: |
          flutter create . --org com.aditicakes --project-name bakery_admin --platforms android
          rm -f test/widget_test.dart
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true
          flutter pub get

      - name: Build release APK
        working-directory: admin_app
        run: flutter build apk --release --dart-define=API_URL=https://cake-bakery-4c4u.onrender.com

      - uses: actions/upload-artifact@v4
        with:
          name: bakery-admin-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
